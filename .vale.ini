StylesPath = .vale/styles
MinAlertLevel = suggestion
Vocab = Ltix

Packages = https://github.com/tbhb/vale-ai-tells/releases/download/v1.29.0/ai-tells.zip

# Elixir docs are Markdown.
[formats]
ex = md
exs = md

[*.{md,ex,exs}]
BasedOnStyles = Vale, Ltix

# A spec citation quotes its section title as the spec page writes it, JWKS
# is the acronym for a JSON Web Key Set, and an email address isn't prose.
TokenIgnores = \[(Core|AGS|DL|NRPS|Cert|Sec)[ \x2C][^\]]*\], \bJWKS\b, [\w.+-]+@[\w-]+(\.[\w-]+)+

# The ai-tells rules that check a rule in CODING_STANDARDS.md.
ai-tells.AffirmativeFormulas = YES
ai-tells.ColonUsage = YES
ai-tells.ConclusionMarkers = YES
ai-tells.ContrastiveFormulas = YES
ai-tells.FigurativeCarries = YES
ai-tells.FigurativeCasts = YES
ai-tells.FigurativeDraws = YES
ai-tells.FigurativeFalls = YES
ai-tells.FigurativeHolds = YES
ai-tells.FigurativeIdioms = YES
ai-tells.FigurativeLands = YES
ai-tells.FigurativeLends = YES
ai-tells.FigurativeLoud = YES
ai-tells.FigurativeQuiet = YES
ai-tells.FigurativeRides = YES
ai-tells.FigurativeRuns = YES
ai-tells.FigurativeSits = YES
ai-tells.FigurativeStrikes = YES
ai-tells.FigurativeWins = YES
ai-tells.FillerPhrases = YES
ai-tells.Metacommentary = YES
ai-tells.OpeningCliches = YES
ai-tells.ParticipialPadding = YES
ai-tells.RestatementMarkers = YES
ai-tells.RhetoricalSelfAnswer = YES
ai-tells.SemicolonUsage = YES
ai-tells.ServesAsDodge = YES
ai-tells.StructureAnnouncements = YES
ai-tells.UnpackExplore = YES
